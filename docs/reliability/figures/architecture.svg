<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">GPU Fleet Reliability Intelligence architecture</title><desc id="desc">Sources flow through interruption measurement and reliability analysis to engineering decisions. Live hardware remains an explicit optional input.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#72d9b4"/></marker></defs>
<rect width="1440" height="850" rx="24" fill="#101d33"/>
<g font-family="Arial, sans-serif">
<text x="55" y="65" fill="#72d9b4" font-size="15" letter-spacing="3">GPU FLEETOPS / RELIABILITY INTELLIGENCE</text>
<text x="55" y="120" fill="#ffffff" font-size="40" font-weight="700">From fleet evidence to a reliability decision.</text>
<text x="55" y="158" fill="#b4c5d8" font-size="19">A reproducible lab for measuring interruptions, separating failure patterns, and evaluating a fix.</text>
<text x="55" y="222" fill="#72d9b4" font-size="14" letter-spacing="1">01 / SOURCES</text>
<rect x="55" y="250" width="305" height="140" rx="13" fill="#1a2b43" stroke="#35516c"/>
<text x="75" y="288" fill="#ffffff" font-size="20" font-weight="700">Fictional CSP adapters</text>
<text x="75" y="327" fill="#b4c5d8" font-size="15">Aurora · Borealis · Cirrus</text>
<text x="75" y="354" fill="#b4c5d8" font-size="15">Explicit units and source IDs</text>
<rect x="55" y="420" width="305" height="140" rx="13" fill="#1a2b43" stroke="#35516c"/>
<text x="75" y="458" fill="#ffffff" font-size="20" font-weight="700">Live inputs when available</text>
<text x="75" y="497" fill="#b4c5d8" font-size="15">DCGM telemetry · local diagnostics</text>
<text x="75" y="524" fill="#b4c5d8" font-size="15">Raw evidence and software versions</text>
<path d="M 366 397 L 392 397" stroke="#72d9b4" stroke-width="2" marker-end="url(#arrow)"/>
<text x="400" y="222" fill="#72d9b4" font-size="14" letter-spacing="1">02 / MEASUREMENT</text>
<rect x="400" y="250" width="305" height="140" rx="13" fill="#1a2b43" stroke="#35516c"/>
<text x="420" y="288" fill="#ffffff" font-size="20" font-weight="700">Interruption episodes</text>
<text x="420" y="327" fill="#b4c5d8" font-size="15">Merge duplicate and overlapping logs</text>
<text x="420" y="354" fill="#b4c5d8" font-size="15">Keep shared incident identities</text>
<rect x="400" y="420" width="305" height="140" rx="13" fill="#1a2b43" stroke="#35516c"/>
<text x="420" y="458" fill="#ffffff" font-size="20" font-weight="700">Operating exposure</text>
<text x="420" y="497" fill="#b4c5d8" font-size="15">Separate GPU, node and job hours</text>
<text x="420" y="524" fill="#b4c5d8" font-size="15">Exclude maintenance and unknown time</text>
<path d="M 711 397 L 737 397" stroke="#72d9b4" stroke-width="2" marker-end="url(#arrow)"/>
<text x="745" y="222" fill="#72d9b4" font-size="14" letter-spacing="1">03 / INTELLIGENCE</text>
<rect x="745" y="250" width="305" height="140" rx="13" fill="#1a2b43" stroke="#35516c"/>
<text x="765" y="288" fill="#ffffff" font-size="20" font-weight="700">Statistical reliability</text>
<text x="765" y="327" fill="#b4c5d8" font-size="15">Pareto · Kaplan–Meier · Weibull</text>
<text x="765" y="354" fill="#b4c5d8" font-size="15">Matched cohorts and uncertainty</text>
<rect x="745" y="420" width="305" height="140" rx="13" fill="#1a2b43" stroke="#35516c"/>
<text x="765" y="458" fill="#ffffff" font-size="20" font-weight="700">Controlled experiments</text>
<text x="765" y="497" fill="#b4c5d8" font-size="15">Randomized canary and control</text>
<text x="765" y="524" fill="#b4c5d8" font-size="15">Held-out prediction benchmark</text>
<path d="M 1056 397 L 1082 397" stroke="#72d9b4" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1090" y="222" fill="#72d9b4" font-size="14" letter-spacing="1">04 / DECISIONS</text>
<rect x="1090" y="250" width="305" height="140" rx="13" fill="#1a2b43" stroke="#35516c"/>
<text x="1110" y="288" fill="#ffffff" font-size="20" font-weight="700">Evidence for engineers</text>
<text x="1110" y="327" fill="#b4c5d8" font-size="15">Gradio · API · exported JSON</text>
<text x="1110" y="354" fill="#b4c5d8" font-size="15">Technical and executive reports</text>
<rect x="1090" y="420" width="305" height="140" rx="13" fill="#1a2b43" stroke="#35516c"/>
<text x="1110" y="458" fill="#ffffff" font-size="20" font-weight="700">Readiness before rollout</text>
<text x="1110" y="497" fill="#b4c5d8" font-size="15">Versioned lab acceptance policy</text>
<text x="1110" y="524" fill="#b4c5d8" font-size="15">Pass · fail · insufficient evidence</text>
<rect x="55" y="625" width="1330" height="152" rx="15" fill="#153c3c" stroke="#307264"/>
<text x="80" y="663" fill="#a6f4d5" font-size="20" font-weight="700">The evidence stays inspectable.</text>
<text x="80" y="703" fill="#d4ede7" font-size="17">Provenance → explicit denominators → source-linked hypotheses → controlled validation → recorded decision</text>
<text x="80" y="741" fill="#a8cfc4" font-size="15">Synthetic replay demonstrates methodology. Physical GPU results require actual hardware. LLMs do not calculate reliability statistics.</text>
<text x="55" y="818" fill="#90a8bf" font-size="13">Python · PostgreSQL / SQLite · SciPy · Prometheus · OpenTelemetry · Plotly · Gradio</text>
</g></svg>