[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-fleetops"
version = "1.1.0"
description = "GPU fleet telemetry, inventory, incident response, and evidence-grounded AI investigation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "gradio>=6.30,<7",
  "httpx>=0.28,<1", "sqlalchemy>=2.0.40,<3", "prometheus-client>=0.22,<1",
  "opentelemetry-sdk>=1.34,<2", "opentelemetry-exporter-otlp-proto-http>=1.34,<2",
  "plotly>=6.1,<7", "numpy>=2.1,<3", "pydantic>=2.11,<3",
  "scipy>=1.16,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "pyyaml>=6,<7"]
postgres = ["psycopg[binary]>=3.2,<4"]
figures = ["matplotlib>=3.9,<4"]

[project.scripts]
fleetops = "fleetops.__main__:main"
fleetops-reliability = "fleetops.reliability.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fleetops = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: API and persistence integration", "ui: Gradio component and event contract"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.coverage.run]
source = ["fleetops"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
